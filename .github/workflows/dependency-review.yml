name: dependency-review

# Blocks a PR that ADDS a dependency (or version) with a known high/critical
# advisory. Only the change is judged, so pre-existing alerts (tracked by
# Dependabot) don't block unrelated PRs. Runs on every PR, so it can be a
# required check.
on:
  pull_request:
  # The merge queue on integration needs this check to report on the queue's
  # commit; the job skips there (a skipped job satisfies a required check),
  # because each PR in the group was already reviewed on its own.
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
