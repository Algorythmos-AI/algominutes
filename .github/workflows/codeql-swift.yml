name: codeql-swift

# CodeQL for the native iOS app. Swift is a compiled language: CodeQL traces a
# real build, so this needs macOS + Xcode (free for a public repo) and several
# minutes. The workflow runs on every PR and push so its check always reports
# and can be required; the analysis itself runs only when the iOS app changed
# (the `changes` job), and weekly.
on:
  pull_request:
  # The merge queue on integration: a required check must also report on the
  # queue's commit, or the queue waits forever.
  merge_group:
  push:
    branches: [integration, main]
  schedule:
    - cron: '41 17 * * 0' # weekly (Mon 03:41 Sydney)

# A new push to a PR cancels that PR's run still going on its previous commit: macOS runners are scarce, and
# one held by a superseded commit is one the train waits for. Queue and push runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides whether the iOS app changed. The workflow itself runs on every PR,
  # so its check always reports and can be required; the macOS job below is
  # skipped (a skipped job satisfies a required check) when nothing iOS changed,
  # because macOS minutes bill ~10x.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The merge-queue skip reads the queued PR's head and its checks.
      pull-requests: read
      checks: read
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # scripts/ios-inputs-changed.sh: runs when these inputs changed; in the merge queue, skips when the
      # queue's commit has exactly the inputs of the PR head that already passed this check.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ios-inputs-changed.sh 'analyze (swift)' apps/ios .github/workflows/codeql-swift.yml scripts/ios-inputs-changed.sh

  analyze:
    name: analyze (swift)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      # The same pinned Xcode as ios-test and Xcode Cloud (docs/runbooks/xcode-cloud.md). The runner image's
      # default (Xcode 16) can't compile Icon Composer's AppIcon.icon, so the app wouldn't build here.
      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_26.3.app
          if [ ! -d "$XCODE" ]; then
            echo "error: $XCODE is not on this runner image; installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Generate Xcode project (pinned XcodeGen)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          XCODEGEN=$(sh scripts/install-xcodegen.sh)
          "$XCODEGEN" generate
      # The Swift packages (Firebase, Google Sign-In and theirs), cloned once per Package.resolved and kept in
      # the Actions cache: cloning them every run took 2 minutes, and 11 under CodeQL's tracer.
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ~/spm-packages
          key: spm-${{ runner.os }}-xcode26.3-${{ hashFiles('apps/ios/AlgoMinutes.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-xcode26.3-
      # Before CodeQL starts tracing: fetching packages under the tracer was about 11 of the job's minutes.
      - name: Resolve packages (not traced)
        working-directory: apps/ios
        run: xcodebuild -resolvePackageDependencies -project AlgoMinutes.xcodeproj -scheme AlgoMinutes -clonedSourcePackagesDirPath "$HOME/spm-packages"
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build (traced, unsigned, simulator)
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -scheme AlgoMinutes \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
