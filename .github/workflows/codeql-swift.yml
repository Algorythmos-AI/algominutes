name: codeql-swift

# CodeQL for the native iOS app. Swift is a compiled language: CodeQL traces a
# real build, so this needs macOS + Xcode (free for a public repo) and several
# minutes. The workflow runs on every PR and push so its check always reports
# and can be required; the analysis itself runs only when the iOS app changed
# (the `changes` job), and weekly.
on:
  pull_request:
  push:
    branches: [integration, main]
  schedule:
    - cron: '41 17 * * 0' # weekly (Mon 03:41 Sydney)

permissions:
  contents: read

jobs:
  # Decides whether the iOS app changed. The workflow itself runs on every PR,
  # so its check always reports and can be required; the macOS job below is
  # skipped (a skipped job satisfies a required check) when nothing iOS changed,
  # because macOS minutes bill ~10x.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
            *) echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0 ;;   # schedule, manual: always
          esac
          # A new branch or a force-push has no usable "before": check everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -qE '^(apps/ios/|\.github/workflows/codeql-swift\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
          echo "iOS changed: $(grep -o 'ios=.*' "$GITHUB_OUTPUT" | tail -1)"

  analyze:
    name: analyze (swift)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Generate Xcode project (pinned XcodeGen)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          XCODEGEN=$(sh scripts/install-xcodegen.sh)
          "$XCODEGEN" generate
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build (traced, unsigned, simulator)
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -scheme AlgoMinutes \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
