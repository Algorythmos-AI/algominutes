name: web-e2e

# The web app end to end, in a real browser, against staging
# (scripts/e2e-web.mjs): a guest imports a recording, it's summarised, search
# and chat find it, a browser recording becomes a note, and the account is
# deleted. Nightly, on demand, and once integration's head is fully deployed:
# the site (a Vercel deployment) and the backend (deploy-staging) each start the
# gate when they finish, and the last to finish starts the run
# (scripts/e2e-web-gate.mjs says why it did or didn't).
#
# Staging is behind Vercel Authentication: the run needs the project's
# "Protection Bypass for Automation" secret as VERCEL_AUTOMATION_BYPASS_SECRET.
# Until the owner adds it (docs/runbooks/site.md), the gate says so and stops.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *' # nightly, 04:17 Sydney
  workflow_run:
    workflows: [deploy-staging]
    types: [completed]
    branches: [integration]
  deployment_status:

permissions:
  contents: read

jobs:
  # No concurrency here: most events are skipped, and a skipped run must never displace a real one
  # (a workflow-level group would, since it applies before any `if:`).
  gate:
    # A finished backend deploy only if it succeeded; a site deployment only if it's Vercel's and succeeded
    # (whether it's integration's head is the gate's first question).
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' && github.event.deployment.creator.login == 'vercel[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/e2e-web-gate.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Is staging integration's head, site and backend?
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.deployment.sha }}
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: node scripts/e2e-web-gate.mjs

  e2e:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # One journey at a time; a second waits rather than cancelling the first.
    concurrency:
      group: web-e2e
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Setup (about 4 minutes) + the journey's budget (E2E_BUDGET_MS, 20 minutes) + the deletion (at most 3).
    timeout-minutes: 40
    env:
      SITE_URL: https://staging.algominutes.algorythmos.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Neither install waits on apt's mirror any more: on 10-23 apt hung here for 39 minutes, and on 10-26 for 5
      # (fonts for --with-deps), then the retry hit the dpkg lock. Both come from the cache; each action says how.
      # From the cache each takes seconds; 12 minutes each covers its slowest path (cold cache, slow download,
      # then apt), as in ci.yml. The job's 40-minute limit still bounds the whole, and a kill is reported.
      - name: Install Chromium
        timeout-minutes: 12
        uses: ./.github/actions/playwright-chromium
      - name: Install ffmpeg (the fake microphone)
        timeout-minutes: 12
        uses: ./.github/actions/ffmpeg
      - name: The journey
        timeout-minutes: 30
        env:
          # Only this step sees the secret (not npm's or apt's install scripts).
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # The pipeline e2e's invite code: staging's guests start with no minutes. Only this step sees it.
          E2E_INVITE_CODE: ${{ secrets.E2E_INVITE_CODE }}
          # 'true' once staging's billing has Stripe's test-mode keys: buy Pro with the test card (PR 28b).
          E2E_STRIPE: ${{ vars.E2E_STRIPE }}
        run: node scripts/e2e-web.mjs

  # A red nightly opens a `web-e2e-failed` issue, or comments on the open one, so a red night is seen the next
  # morning and fixed, never retried away (RELEASE.md R11.5 §3). Scheduled runs only: a run started by hand is
  # watched by whoever started it.
  report-failure:
    needs: [gate, e2e]
    # The journey killed at its time limit on 2026-10-23 concluded `cancelled`, not `failure`, so failure()
    # alone would never have reported it. A run cancelled as a whole is skipped (!cancelled()).
    if: >-
      !cancelled() && github.event_name == 'schedule'
      && (needs.gate.result == 'failure' || needs.e2e.result == 'failure' || needs.e2e.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the web-e2e-failed issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body="The nightly web journey failed on ${SHA:0:7} ($RUN_URL). Its FAIL lines say which step, and what the page showed."
          gh label create web-e2e-failed --color B60205 --description "The nightly web journey failed" 2>/dev/null \
            || echo "label web-e2e-failed exists"
          open=$(gh issue list --label web-e2e-failed --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --label web-e2e-failed --title "Nightly web journey failed on ${SHA:0:7}" \
              --body "$body Close this once a scheduled run is green."
          fi
