name: site-smoke

# scripts/smoke-site.mjs against the deployed public site: after each Vercel
# deployment (its GitHub deployment status), and daily against production, so
# the store listings' Privacy, Support and deletion URLs, and security.txt's
# expiry, are watched even when nothing deploys. docs/runbooks/site.md.
on:
  deployment_status:
  schedule:
    - cron: '17 21 * * *' # 07:17 in Sydney
  workflow_dispatch:
    inputs:
      url:
        description: Origin to check
        default: https://algominutes.algorythmos.com

permissions:
  contents: read

jobs:
  smoke:
    # A deployment status comes from Vercel (the site: it has an environment URL) and from every job of
    # deploy-staging.yml that names the `staging` environment (Cloud Run: it has none). The second kind is not
    # a site deployment, and each one failed this job on "not an https origin" (30 red runs on 2026-10-06).
    if: >-
      github.event_name != 'deployment_status'
      || (github.event.deployment_status.state == 'success'
          && (github.event.deployment_status.environment == 'Production'
              || github.event.deployment_status.environment_url != ''))
    runs-on: ubuntu-latest
    steps:
      # The nightly run checks production, which is `main`. With the default branch's script it compared
      # production with headers `integration` has and `main` doesn't yet: red every night between promotions
      # (2026-09-29 to 10-06), which says nothing about the site. Production is held to what shipped with it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Smoke the site
        env:
          EVENT: ${{ github.event_name }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          INPUT_URL: ${{ inputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          case "$EVENT" in
            workflow_dispatch) url="$INPUT_URL" ;;
            schedule) url="https://algominutes.algorythmos.com" ;;
            deployment_status)
              if [ "$ENVIRONMENT" = "Production" ]; then
                # The custom domain, not the deployment URL: it's what the stores link to.
                url="https://algominutes.algorythmos.com"
              elif [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
                url="$DEPLOYMENT_URL"
              else
                echo "::notice::Preview deployment $DEPLOYMENT_URL is behind Vercel Authentication and VERCEL_AUTOMATION_BYPASS_SECRET isn't set; skipped."
                exit 0
              fi
              ;;
          esac
          case "$url" in https://*) ;; *) echo "::error::not an https origin: $url"; exit 1 ;; esac
          node scripts/smoke-site.mjs "$url"
