name: docker-build

# Builds every service image from the repo root (the context all the service
# Dockerfiles assume) to prove the npm-workspaces vendoring resolves and the
# image is coherent. Build-only — no registry push; that is the deploy
# workflow's job (PR-07).
on:
  push:
    branches: [integration, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, billing, db-job, embedder, extractor, notifier, summarizer, transcoder]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: algominutes-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
