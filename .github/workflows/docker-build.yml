name: docker-build

# Builds every service image from the repo root (the context all the service
# Dockerfiles assume) to prove the npm-workspaces vendoring resolves and the
# image is coherent, then boots each one (scripts/boot-smoke.sh). No registry
# push; that is the deploy workflow's job.
on:
  push:
    branches: [integration, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, billing, db-job, embedder, extractor, notifier, summarizer, transcoder]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: algominutes-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Building proves the image assembles; this proves it STARTS. A missing
      # runtime dependency (e.g. a package only another workspace declares)
      # builds fine and then crash-loops on Cloud Run.
      - name: Boot smoke ${{ matrix.service }}
        run: bash scripts/boot-smoke.sh "${{ matrix.service }}" "algominutes-${{ matrix.service }}:ci"
