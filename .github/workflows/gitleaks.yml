name: gitleaks

on:
  push:
    branches: [integration, main]
  pull_request:

# Runs the gitleaks binary directly rather than gitleaks/gitleaks-action@v2.
# The Action wrapper requires a paid GITLEAKS_LICENSE for organization-owned
# repos (Algorythmos-AI is an org); the CLI itself is free and unlimited and is
# exactly what `npm run gitleaks` runs locally. Same engine, same empty
# allowlist in .gitleaks.toml — no license, no allowlist widening (CLAUDE.md §6).
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks detect (empty allowlist — see .gitleaks.toml)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="--all"
