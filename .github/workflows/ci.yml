name: ci

# Typecheck + unit + integration tests on every PR and push. The gate is real:
# the root `typecheck` covers the shared TS libraries, `npm test` runs the
# vitest suites, and `test:node` runs the two node:test suites (transcoder
# providers, diarisation DER). No network, no DB, no credentials.
on:
  push:
    branches: [integration, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The transcoder's duration probe is tested against the real ffmpeg (as its
      # image runs it); without it those tests skip.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Typecheck (shared TS libraries)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Unit tests (node:test suites)
        run: npm run test:node
      # The committed OpenAPI spec is what the iOS/Android/web clients are
      # generated from, so it must be exactly what the zod source produces.
      # Regeneration is deterministic; any diff means a stale spec.
      - name: OpenAPI spec matches its zod source (no drift)
        run: |
          npm run openapi -w @algominutes/contracts
          if ! git diff --exit-code -- packages/contracts/openapi/; then
            echo "::error::packages/contracts/openapi/openapi.v1.json is stale. Run: npm run openapi -w @algominutes/contracts, and commit the result."
            exit 1
          fi

  # Integration tests against a REAL Postgres 16 + pgvector (never mocked):
  # migrations apply on a real server, replay idempotency, PII-before-storage,
  # and cross-workspace isolation. Always runs, so it can be a required check.
  # The web app's production build (vite): it broke unnoticed once already
  # (tesseract assets, missing native-plugin shims) because nothing built it.
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Typecheck apps/web
        run: npm run typecheck -w apps/web
      - name: Build apps/web
        run: npm run build -w apps/web

  # The public site (apps/site, algominutes.algorythmos.com): types, the build,
  # valid HTML, then the built pages in Chromium under vercel.json's headers and
  # CSP (scripts/serve-site.mjs), and Lighthouse >= 95 in every category.
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck apps/site (astro check)
        run: npm run check -w apps/site
      - name: Build apps/site
        run: npm run build -w apps/site
      - name: Valid HTML (html-validate)
        run: npm run validate -w apps/site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Built pages, links and browser checks
        run: npx vitest run --config vitest.site.config.ts
      - name: Lighthouse (every category >= 95)
        run: npx -y @lhci/cli@0.15.1 autorun --config=apps/site/lighthouserc.json

  # infra/firebase/firestore.rules against the Firestore emulator (it needs Java).
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Firestore rules (emulator)
        run: >-
          npx -y firebase-tools@15.31.0 --config infra/firebase/firebase.json
          emulators:exec --only firestore --project demo-algominutes
          "npx vitest run -c vitest.rules.config.ts"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: algominutes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d algominutes"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/algominutes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integration tests (real Postgres)
        run: npm run test:integration
      # Every service pool capped at ONE connection (the connection budget's
      # floor). Code that holds a client and then asks the same pool for another
      # deadlocks here, instead of in production under a tight budget.
      - name: Integration tests with every pool capped at 1 (PG_POOL_MAX=1)
        env:
          PG_POOL_MAX: '1'
        run: npm run test:integration -- --testTimeout=15000
