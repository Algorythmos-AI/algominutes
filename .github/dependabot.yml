# Dependabot version updates (plan PR-09). PRs target `integration` (the
# default branch) and go through the same CI as any other PR. Grouped, and
# with low open-PR limits, so they arrive as a few reviewable PRs a week
# rather than a flood that fights the serial PR train. Majors come one at a time.
#
# Not covered: Swift packages. The iOS app declares SPM packages in XcodeGen's
# project.yml, which Dependabot's `swift` ecosystem can't read (it needs a
# Package.swift). Firebase/GoogleSignIn are bumped by hand, in iOS PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Australia/Sydney
    open-pull-requests-limit: 4
    commit-message:
      prefix: chore(deps)
    ignore:
      # google-auth-library mints the Vertex AI token for every Gemini, embedding
      # and chat call (packages/ai, api, db-job). Its majors change the request
      # layer, and only staging exercises Cloud Run's metadata server, so they move
      # as one staging-verified migration (BLOCKERS), not a weekly bump.
      - dependency-name: google-auth-library
        update-types: ['version-update:semver-major']
      # Express 5 changes routing syntax, promise handling and req/res APIs across
      # all 7 services. It is a planned migration (BLOCKERS), not a weekly bump.
      - dependency-name: express
        update-types: ['version-update:semver-major']
      # apps/web toolchain (on vite 8 + plugin-react 6 since 2026-09-25): vite,
      # its React plugin and Tailwind's plugin move majors together, as one planned
      # migration verified by the web-build CI job.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tailwindcss/vite'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is the native (Go) compiler and ships no compiler API, so
      # typescript-eslint (peer <6.1), @astrojs/check (^5 || ^6) and our AST
      # invariant gates can't run on it. Held at 6 until they support 7 (BLOCKERS).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node's types follow the Node runtime (node:24 images, CI node-version 24),
      # so a newer major would type APIs production doesn't have. They move with
      # the Node 26 upgrade (BLOCKERS), not on their own.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: ['/services/*']
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
    ignore:
      # Production runs Node LTS only. Majors are planned moves between EVEN
      # releases: odd majors are never LTS and are short-lived (Dependabot
      # proposed node:25, already EOL). Minor/patch/digest updates still flow.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      base-images:
        patterns: ['*']

  - package-ecosystem: terraform
    directories: ['/infra/terraform/envs/*', '/infra/terraform/modules/*']
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
    groups:
      providers:
        patterns: ['*']
