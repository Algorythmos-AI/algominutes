name: AlgoMinutes
options:
  bundleIdPrefix: com.algorythmos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Debug and Staging talk to the staging backend; Release to production.
# Staging is a release-type build (optimised, no DEBUG), archived by the
# AlgoMinutes-Staging scheme for internal TestFlight.
configs:
  Debug: debug
  Staging: release
  Release: release

# Exact versions, and Package.resolved is committed: Xcode Cloud resolves
# packages only from a committed Package.resolved, and every build (local,
# GitHub CI, Xcode Cloud) must get the same dependency graph. To upgrade, change
# a version here, run `xcodegen generate` and
# `xcodebuild -resolvePackageDependencies -scheme AlgoMinutes`, and commit both.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 11.15.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 8.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "14"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    # ALGORYTHMOS PTY LTD. — inherited by every target. Signing stays Automatic
    # (-allowProvisioningUpdates registers ids/profiles at archive; see A4/PR-25).
    DEVELOPMENT_TEAM: NY9MS8GSBK
  # The backend each build talks to (Info.plist → AppConfig.swift). Cloud Run
  # URLs are deterministic: https://<service>-<project number>.<region>.run.app
  # (infra/terraform/modules/environment/cloud-run.tf).
  configs:
    Debug:
      API_BASE_URL: https://api-627101926311.australia-southeast1.run.app
      BILLING_BASE_URL: https://billing-627101926311.australia-southeast1.run.app
      UPDATE_URL: itms-beta://
      PAYWALL_ENABLED: "YES"
      INVITE_CODES_ENABLED: "YES"
      CALL_CAPTURE_ENABLED: "YES"
      MICROPHONE_USAGE_DESCRIPTION: "AlgoMinutes uses your microphone only while you record: a meeting or note in the app, or your side of a call in another app that you choose to capture. The audio is uploaded to your AlgoMinutes account to be transcribed and summarised, and is kept there until you delete it. Recording never starts on its own."
    Staging:
      API_BASE_URL: https://api-627101926311.australia-southeast1.run.app
      BILLING_BASE_URL: https://billing-627101926311.australia-southeast1.run.app
      UPDATE_URL: itms-beta://
      # The beta sells Pro in Apple's sandbox (RELEASE.md PR 27; TestFlight buys
      # there, nobody is charged). Until the products exist in App Store Connect
      # the paywall offers the invite code instead of a dead end.
      PAYWALL_ENABLED: "YES"
      # The beta's way to minutes (BETA-XXXXX-... codes, RELEASE.md rev 10).
      INVITE_CODES_ENABLED: "YES"
      # "Record a call" (the ReplayKit broadcast extension) stays in development and on staging only, behind the
      # server's broadcast_capture switch. The App Store build has none of it (DECISIONS.md, 2026-10-29).
      CALL_CAPTURE_ENABLED: "YES"
      MICROPHONE_USAGE_DESCRIPTION: "AlgoMinutes uses your microphone only while you record: a meeting or note in the app, or your side of a call in another app that you choose to capture. The audio is uploaded to your AlgoMinutes account to be transcribed and summarised, and is kept there until you delete it. Recording never starts on its own."
    Release:
      # Production's Cloud Run origins (algominutes-production, project number
      # 43914754953). The "Backend origins are set" phase still fails a build
      # whose origins are empty or not https.
      API_BASE_URL: https://api-43914754953.australia-southeast1.run.app
      BILLING_BASE_URL: https://billing-43914754953.australia-southeast1.run.app
      # The update screen's button (426): the App Store listing (App Store
      # Connect app 6816333591). A Release build must never open TestFlight.
      UPDATE_URL: itms-apps://apps.apple.com/app/id6816333591
      # The App Store build (plan rev 12, Stage 3, I2): Pro is sold with StoreKit, and nothing of the beta shows
      # (no invite code entry, no beta wording). A Release archive needs prod and its App Store Connect products
      # first, so this sells nothing until they exist.
      PAYWALL_ENABLED: "YES"
      INVITE_CODES_ENABLED: "NO"
      # No call capture in 1.0 (DECISIONS.md, 2026-10-29): iOS gives a screen broadcast no call audio (device
      # proof 5), so "Record a call" couldn't do what it says. The extension isn't embedded (the "Call capture
      # only where the build has it" phase), nothing shows it, and the microphone text doesn't mention calls.
      CALL_CAPTURE_ENABLED: "NO"
      MICROPHONE_USAGE_DESCRIPTION: "AlgoMinutes uses your microphone only while you record a meeting or note in the app. The audio is uploaded to your AlgoMinutes account to be transcribed and summarised, and is kept there until you delete it. Recording never starts on its own."

targets:
  AlgoMinutes:
    type: application
    platform: iOS
    sources:
      - path: AlgoMinutes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.algorythmos.algominutes
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: AlgoMinutes/Info.plist
        CODE_SIGN_ENTITLEMENTS: AlgoMinutes/AlgoMinutes.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # DEVELOPMENT_TEAM (NY9MS8GSBK) is set globally in settings.base.
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        # CALL_CAPTURE_YES or CALL_CAPTURE_NO: the code that names the broadcast extension (BroadcastPickerView)
        # is compiled only into a build that has call capture.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CALL_CAPTURE_$(CALL_CAPTURE_ENABLED)"
      configs:
        # The App Store build has no call capture (CALL_CAPTURE_ENABLED=NO): the "Embed Foundation Extensions"
        # copy phase leaves the broadcast extension out, so the app has no PlugIns/BroadcastExtension.appex.
        # A copy phase can't differ per configuration; EXCLUDED_SOURCE_FILE_NAMES, which can, also applies to it.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: BroadcastExtension.appex
    dependencies:
      # Built for every configuration; embedded only where the build has call capture (EXCLUDED_SOURCE_FILE_NAMES
      # above, checked by the "Call capture only where the build has it" phase).
      - target: BroadcastExtension
        embed: true
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    preBuildScripts:
      # Every build that reaches a device talks to a real backend: fail early,
      # and clearly, when a configuration has no API or billing origin.
      - name: Backend origins are set
        script: |
          set -eu
          for pair in "API_BASE_URL=${API_BASE_URL:-}" "BILLING_BASE_URL=${BILLING_BASE_URL:-}"; do
            value="${pair#*=}"
            case "$value" in
              https://?*) ;;
              *)
                echo "error: ${CONFIGURATION} has no ${pair%%=*} (an https origin; project.yml). Each build needs its backend's origins."
                exit 1 ;;
            esac
          done
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # The broadcast extension is in the app exactly when the build has call capture (CALL_CAPTURE_ENABLED): the
      # App Store build (Release) must not carry it, and a build that offers "Record a call" must. Runs after the
      # copy phase, before signing. A stale copy from an earlier build of the same folder is removed, not shipped.
      - name: Call capture only where the build has it
        script: |
          set -euo pipefail
          APPEX="${TARGET_BUILD_DIR}/${PLUGINS_FOLDER_PATH}/BroadcastExtension.appex"
          if [ "${CALL_CAPTURE_ENABLED:-NO}" = "YES" ]; then
            if [ ! -d "$APPEX" ]; then
              echo "error: ${CONFIGURATION} has call capture but BroadcastExtension.appex isn't embedded ($APPEX)"
              exit 1
            fi
            exit 0
          fi
          if [ -d "$APPEX" ]; then
            if [ "${EXCLUDED_SOURCE_FILE_NAMES:-}" != "BroadcastExtension.appex" ]; then
              echo "error: ${CONFIGURATION} has no call capture but embeds BroadcastExtension.appex (EXCLUDED_SOURCE_FILE_NAMES)"
              exit 1
            fi
            echo "warning: removing a BroadcastExtension.appex an earlier build left in ${TARGET_BUILD_DIR}"
            rm -rf "$APPEX"
          fi
          echo "${CONFIGURATION} has no call capture: no BroadcastExtension.appex in the app"
        basedOnDependencyAnalysis: false
      # The Google Sign-In callback scheme is the bundled GoogleService-Info.plist's
      # REVERSED_CLIENT_ID, written into the built Info.plist (before signing), so
      # it always matches the Firebase project the build was configured with and
      # no client id lives in the repo. Staging and Release builds need the plist;
      # Debug (CI, simulator tests) runs with FirebaseBootstrap's placeholder.
      - name: Google Sign-In URL scheme from GoogleService-Info.plist
        script: |
          set -euo pipefail
          GSI="${SRCROOT}/AlgoMinutes/Resources/GoogleService-Info.plist"
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          # The built Info.plist is this phase's declared input (below), so the
          # build system runs it after that file is written. Without the input the
          # two raced, and PlistBuddy created a stray Info.plist and failed.
          if [ ! -f "$PLIST" ]; then
            echo "error: the built Info.plist isn't there yet ($PLIST): this phase must run after it's processed"
            exit 1
          fi
          if [ ! -f "$GSI" ]; then
            if [ "${CONFIGURATION}" != "Debug" ]; then
              echo "error: ${CONFIGURATION} needs AlgoMinutes/Resources/GoogleService-Info.plist (git-ignored; see docs/runbooks)"
              exit 1
            fi
            exit 0
          fi
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$GSI")
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 ${REVERSED}" "$PLIST"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
      # Crashlytics needs the dSYM of every build that reaches a device outside
      # development (Staging and Release). This phase covers archives made on a
      # Mac. Xcode Cloud uploads from ci_scripts/ci_post_xcodebuild.sh instead
      # (CI_WORKFLOW is set there), and GitHub CI's unsigned Staging build sets
      # ALGOMINUTES_SKIP_DSYM_UPLOAD=YES (it has a fake plist).
      - name: Upload dSYMs to Crashlytics
        script: |
          if [ "${CONFIGURATION}" = "Debug" ] || [ -n "${CI_WORKFLOW:-}" ] || [ "${ALGOMINUTES_SKIP_DSYM_UPLOAD:-NO}" = "YES" ]; then
            exit 0
          fi
          RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -x "$RUN" ]; then
            "$RUN"
          else
            # Visible in the build log; the archive still succeeds.
            echo "warning: Crashlytics upload script not found at $RUN; dSYMs were not uploaded"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/AlgoMinutes/Resources/GoogleService-Info.plist
        basedOnDependencyAnalysis: false

  AlgoMinutesTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: AlgoMinutesTests
      # The broadcast extension's capture writer, compiled here too so its kill-safety is tested (I3).
      - path: BroadcastShared
      # The contract's /v1 fixtures (packages/contracts/fixtures), which ContractFixturesTests decodes with the
      # app's own models: a folder in the test bundle, never in the app.
      - path: ../../packages/contracts/fixtures/v1
        type: folder
        buildPhase: resources
    dependencies:
      - target: AlgoMinutes

  # XCUITest smoke (plan PR-29): the real app launches and renders its first
  # screen on the simulator, on every iOS PR (ios.yml runs the scheme's tests).
  AlgoMinutesUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: AlgoMinutesUITests
    dependencies:
      - target: AlgoMinutes

  # ReplayKit broadcast extension — re-homed out of the deleted Capacitor ios/
  # target (EXTRACTION-AUDIT §6). On-device capture of another app's audio + App
  # Group handoff; a §5 protected asset. Signing/App-Group identity finalised in A4.
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
      # The capture writer's configuration, shared with AlgoMinutesTests so the tests write what ships (I3).
      - path: BroadcastShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.algorythmos.algominutes.BroadcastExtension
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/BroadcastExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        # iPhone only, like the app. XcodeGen's extension default is "1,2",
        # which would declare an iPad extension inside an iPhone-only app.
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  AlgoMinutes:
    build:
      targets:
        AlgoMinutes: all
        AlgoMinutesTests: [test]
        AlgoMinutesUITests: [test]
        BroadcastExtension: all
    run:
      config: Debug
      # Debug runs from Xcode buy from the local StoreKit configuration (the
      # beta's products, placeholder prices). Kept out of every target: it never
      # ships.
      storeKitConfiguration: StoreKit/AlgoMinutes.storekit
    test:
      config: Debug
      targets:
        - AlgoMinutesTests
        - AlgoMinutesUITests
    archive:
      config: Release
  # The Release build's UI tests on a phone (device-tests.sh --release). Its own scheme because Xcode builds
  # every test target in a scheme, and the unit tests need Debug's testability: they can't build in Release.
  AlgoMinutes-ReleaseUITests:
    build:
      targets:
        AlgoMinutes: all
        AlgoMinutesUITests: [test]
        BroadcastExtension: all
    test:
      config: Release
      targets:
        - AlgoMinutesUITests
  # Internal TestFlight against staging (Xcode Cloud, plan PR-30).
  AlgoMinutes-Staging:
    build:
      targets:
        AlgoMinutes: all
        BroadcastExtension: all
    run:
      config: Staging
    archive:
      config: Staging
