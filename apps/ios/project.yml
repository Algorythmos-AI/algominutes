name: Wassup
options:
  bundleIdPrefix: com.wassup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "14"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

targets:
  Wassup:
    type: application
    platform: iOS
    sources:
      - path: Wassup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wassup.meeting
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Wassup/Info.plist
        CODE_SIGN_ENTITLEMENTS: Wassup/Wassup.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # TODO(signing A4): set Algorythmos DEVELOPMENT_TEAM + provisioning profile.
        # Client signing identity (team HX9DZ34625, "Wassup App Store") stripped.
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    dependencies:
      - target: BroadcastExtension
        embed: true
      - target: BroadcastExtensionSetupUI
        embed: true
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    postBuildScripts:
      # Crashlytics needs the dSYM after every Release build; Debug/simulator
      # builds skip the upload (no symbols leave the machine in development).
      - name: Upload dSYMs to Crashlytics
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/Wassup/Resources/GoogleService-Info.plist
        basedOnDependencyAnalysis: false

  WassupTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: WassupTests
    dependencies:
      - target: Wassup

  # ReplayKit broadcast extension — re-homed out of the deleted Capacitor ios/
  # target (EXTRACTION-AUDIT §6). On-device capture of another app's audio + App
  # Group handoff; a §5 protected asset. Signing/App-Group identity finalised in A4.
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wassup.meeting.BroadcastExtension
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/BroadcastExtension.entitlements
        CODE_SIGN_STYLE: Automatic

  BroadcastExtensionSetupUI:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtensionSetupUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wassup.meeting.BroadcastExtensionSetupUI
        INFOPLIST_FILE: BroadcastExtensionSetupUI/Info.plist
        CODE_SIGN_STYLE: Automatic

schemes:
  Wassup:
    build:
      targets:
        Wassup: all
        WassupTests: [test]
        BroadcastExtension: all
        BroadcastExtensionSetupUI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WassupTests
    archive:
      config: Release
